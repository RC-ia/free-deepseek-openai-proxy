<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FreeDeepseekAPI</title>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --red:#f85149; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:36px; width:100%; max-width:360px; }
.login-box h2 { margin-bottom:6px; text-align:center; font-size:20px; }
.login-box p { color:var(--muted); text-align:center; font-size:13px; margin-bottom:24px; }
.login-box input { width:100%; padding:11px 13px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; margin-bottom:14px; font-size:14px; }
.login-box input:focus { outline:none; border-color:var(--accent); }
.login-box button { width:100%; padding:11px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.login-box button:hover { filter:brightness(1.1); }
.err { color:var(--red); font-size:13px; text-align:center; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
<div class="login-box">
    <h2>🔐 FreeDeepseekAPI</h2>
    <p>Acesso restrito ao dashboard</p>
    <form id="login-form">
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <div class="err" id="err"></div>
    </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const err = document.getElementById('err');
    err.textContent = '';
    try {
        const r = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
        });
        if (r.ok) { window.location = '/'; }
        else {
            const d = await r.json().catch(() => ({}));
            err.textContent = d.error || 'Senha incorreta';
        }
    } catch (ex) {
        err.textContent = 'Erro de rede: ' + ex.message;
    }
});
</script>
</body>
</html>
