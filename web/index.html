<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeDeepseekAPI — Dashboard</title>
<style>
:root {
    --bg: #0a0e17;
    --bg-grad: radial-gradient(1200px 600px at 20% -10%, rgba(88,166,255,.08), transparent 60%),
                radial-gradient(1000px 500px at 90% 110%, rgba(188,140,255,.06), transparent 60%);
    --panel: rgba(22,27,34,.85);
    --panel-solid: #161b22;
    --border: rgba(48,54,61,.6);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #bc8cff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --shadow: 0 8px 32px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--text);
    min-height: 100vh;
}
.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 28px;
    background: rgba(13,17,23,.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; box-shadow: 0 0 20px rgba(88,166,255,.3);
}
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.topbar .spacer { flex: 1; }
.topbar nav { display: flex; gap: 4px; background: rgba(255,255,255,.04); padding: 4px; border-radius: 10px; }
.topbar nav a {
    color: var(--muted); text-decoration: none; padding: 7px 16px;
    border-radius: 8px; font-size: 13px; font-weight: 500;
    transition: all .2s;
}
.topbar nav a.active, .topbar nav a:hover {
    color: var(--text); background: rgba(88,166,255,.15);
}
.logout {
    color: var(--muted); font-size: 13px; text-decoration: none;
    padding: 7px 12px; border-radius: 8px; transition: all .2s;
}
.logout:hover { color: var(--red); background: rgba(248,81,73,.1); }
.container { padding: 28px; max-width: 1200px; margin: 0 auto; }
.badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: .03em; }
.badge.green { background: rgba(63,185,80,.15); color: var(--green); box-shadow: inset 0 0 0 1px rgba(63,185,80,.25); }
.badge.red { background: rgba(248,81,73,.15); color: var(--red); box-shadow: inset 0 0 0 1px rgba(248,81,73,.25); }
.badge.yellow { background: rgba(210,153,34,.15); color: var(--yellow); box-shadow: inset 0 0 0 1px rgba(210,153,34,.25); }
.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    animation: fadeUp .4s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
.card h2 .count-pill {
    background: rgba(88,166,255,.12); color: var(--accent);
    font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 600;
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 13px 14px; border-bottom: 1px solid rgba(48,54,61,.4); }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background .15s; }
tbody tr:hover { background: rgba(88,166,255,.04); }
.account-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.avatar {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, rgba(88,166,255,.25), rgba(188,140,255,.25));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--accent);
}
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.status-dot.alive { background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.7); animation: pulse 2s infinite; }
.status-dot.dead { background: var(--red); box-shadow: 0 0 8px rgba(248,81,73,.6); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; backdrop-filter: blur(8px); box-shadow: var(--shadow);
    position: relative; overflow: hidden; transition: transform .2s;
}
.stat:hover { transform: translateY(-2px); }
.stat .icon { font-size: 20px; margin-bottom: 8px; opacity: .9; }
.stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.stat .value { font-size: 30px; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; }
.stat .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stat::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
}
.stat:nth-child(2)::after { background: linear-gradient(90deg, var(--green), transparent); }
.stat:nth-child(3)::after { background: linear-gradient(90deg, var(--red), transparent); }
.stat:nth-child(4)::after { background: linear-gradient(90deg, var(--accent-2), transparent); }
canvas { width: 100% !important; max-height: 300px; }
.controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
.controls select, .controls button {
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border); padding: 9px 16px;
    border-radius: 10px; font-size: 13px; cursor: pointer;
    transition: all .2s; backdrop-filter: blur(8px);
}
.controls select:hover, .controls button:hover { border-color: var(--accent); }
.controls button.active { background: rgba(88,166,255,.15); border-color: var(--accent); color: var(--accent); }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-image: var(--bg-grad); }
.login-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px; width: 100%; max-width: 380px; backdrop-filter: blur(12px);
    box-shadow: var(--shadow); animation: fadeUp .4s ease;
}
.login-box .logo-icon { width: 48px; height: 48px; font-size: 24px; border-radius: 14px; margin: 0 auto 16px; }
.login-box h2 { margin-bottom: 8px; text-align: center; font-size: 22px; }
.login-box p { color: var(--muted); text-align: center; font-size: 13px; margin-bottom: 28px; }
.login-box input {
    width: 100%; padding: 12px 14px; background: rgba(13,17,23,.8); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; font-size: 14px;
    transition: border-color .2s;
}
.login-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
.login-box button {
    width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
    cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: filter .2s, transform .1s;
}
.login-box button:hover { filter: brightness(1.1); }
.login-box button:active { transform: scale(.98); }
.err { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
.muted { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
    .container { padding: 14px; }
    .topbar { padding: 12px 16px; }
    .topbar nav a { padding: 6px 10px; }
}
</style>
</head>
<body>
<div class="topbar">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <h1>FreeDeepseekAPI</h1>
    </div>
    <div class="spacer"></div>
    <nav>
        <a href="/" class="active">Contas</a>
        <a href="/metrics">Métricas</a>
    </nav>
    <a href="/logout" class="logout">Sair</a>
</div>
<div class="container">
    <div class="card">
        <h2>📡 Contas DeepSeek <span class="count-pill" id="count-pill">0</span></h2>
        <div id="accounts-table"><div class="empty">Carregando...</div></div>
    </div>
</div>
<script>
async function load() {
    try {
        const r = await fetch('/api/accounts');
        if (r.status === 401) { window.location = '/login'; return; }
        const d = await r.json();
        const accs = d.accounts || [];
        document.getElementById('count-pill').textContent = accs.length;
        if (!accs.length) {
            document.getElementById('accounts-table').innerHTML = '<div class="empty">Nenhuma conta configurada.</div>';
            return;
        }
        let html = '<table><thead><tr><th>Conta</th><th>Status</th><th>Falhas</th><th>Cooldown</th><th>Última chamada</th></tr></thead><tbody>';
        for (const a of accs) {
            const alive = a.status === 'alive';
            const cd = a.cooldown_remaining_sec > 0 ? a.cooldown_remaining_sec + 's' : '—';
            const last = a.last_used_at ? new Date(a.last_used_at).toLocaleTimeString('pt-BR') : 'nunca';
            const badge = alive
                ? '<span class="badge green">viva</span>'
                : (a.status === 'dead' ? '<span class="badge red">morta</span>' : '<span class="badge yellow">desconhecida</span>');
            const failColor = a.consecutive_failures >= 3 ? 'color:var(--red);font-weight:700;'
                : a.consecutive_failures > 0 ? 'color:var(--yellow);font-weight:600;' : '';
            const num = a.id.replace('account_', '');
            html += `<tr>
                <td><div class="account-cell"><div class="avatar">${num}</div>${a.id}</div></td>
                <td><span class="status-dot ${alive ? 'alive' : 'dead'}"></span>${badge}</td>
                <td style="${failColor}">${a.consecutive_failures}${a.failures_total > 0 ? ' <span class="muted">(' + a.failures_total + ')</span>' : ''}</td>
                <td>${cd}</td>
                <td>${last}</td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('accounts-table').innerHTML = html;
    } catch (e) {
        document.getElementById('accounts-table').innerHTML = '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
    }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
